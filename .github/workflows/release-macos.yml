name: Release macOS

# Builds the signed + notarized macOS installer on macos-15 and attaches it
# to a GitHub Release on this repo.
#
# Runs automatically when a GitHub Release is published, or manually for an
# existing release tag. Requires these repository secrets:
#   MAC_CERTIFICATE           base64 of your Developer ID Application .p12
#   MAC_CERTIFICATE_PASSWORD  password for that .p12
#   APPLE_ID                  Apple ID email used for notarization
#   APPLE_PASSWORD            app-specific password for that Apple ID
#   APPLE_TEAM_ID             10-character Apple Developer Team ID

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing GitHub Release tag to attach Mac artifacts to'
        required: true
        default: 'v0.1.0'
      ref:
        description: 'Git ref to build (empty = the tag)'
        required: false
        default: ''

concurrency:
  group: release-electron
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  # Releases published before Apple signing is set up (e.g. a manually
  # uploaded unsigned build) skip the signed build instead of failing.
  check-signing:
    name: Check signing secrets
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - id: check
        env:
          MAC_CERTIFICATE: ${{ secrets.MAC_CERTIFICATE }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$MAC_CERTIFICATE" ] && [ -n "$APPLE_ID" ] && [ -n "$APPLE_PASSWORD" ] && [ -n "$APPLE_TEAM_ID" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Signed Mac build skipped::Add MAC_CERTIFICATE, MAC_CERTIFICATE_PASSWORD, APPLE_ID, APPLE_PASSWORD and APPLE_TEAM_ID repository secrets to build signed, notarized Mac releases automatically."
          fi

  build-mac:
    name: Build macOS
    needs: check-signing
    if: needs.check-signing.outputs.ready == 'true'
    runs-on: macos-15
    timeout-minutes: 120

    env:
      PKG_CONFIG_PATH: /opt/homebrew/lib/pkgconfig

    steps:
      - name: Resolve refs
        id: refs
        run: |
          TAG="${{ inputs.tag || github.event.release.tag_name }}"
          REF="${{ inputs.ref }}"
          if [ -z "$REF" ]; then REF="$TAG"; fi
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building ref=$REF for release $TAG"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.refs.outputs.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Homebrew build deps
        run: |
          brew install meson ninja cmake pkg-config gstreamer abseil

      - name: Record GStreamer version
        id: gst
        run: |
          GST_VERSION=$(pkg-config --modversion gstreamer-1.0)
          echo "version=$GST_VERSION" >> "$GITHUB_OUTPUT"
          echo "GStreamer $GST_VERSION"
          pkg-config --exists gstreamer-app-1.0 gstreamer-audio-1.0 gstreamer-bad-audio-1.0

      - name: Cache AEC static deps
        uses: actions/cache@v4
        with:
          path: src/native/aec/deps
          key: aec-deps-macos-arm64-gst${{ steps.gst.outputs.version }}-webrtc-v1.3

      - name: Build webrtc-audio-processing
        run: |
          DEPS_DIR="$GITHUB_WORKSPACE/src/native/aec/deps"
          if [ -f "$DEPS_DIR/lib/libwebrtc-audio-processing-1.a" ]; then
            echo "webrtc-audio-processing already present"
            exit 0
          fi

          git clone --depth 1 --branch v1.3 \
            https://gitlab.freedesktop.org/pulseaudio/webrtc-audio-processing.git \
            /tmp/webrtc-audio-processing-src

          meson setup /tmp/webrtc-audio-processing-build \
            --prefix="$DEPS_DIR" \
            --default-library=static \
            --buildtype=release \
            -Dc_args="-fPIC" \
            -Dcpp_args="-fPIC" \
            /tmp/webrtc-audio-processing-src

          ninja -C /tmp/webrtc-audio-processing-build
          ninja -C /tmp/webrtc-audio-processing-build install
          ls -la "$DEPS_DIR/lib/"*.a

      - name: Build webrtcdsp GStreamer plugin
        run: |
          DEPS_DIR="$GITHUB_WORKSPACE/src/native/aec/deps"
          PLUGIN_DIR="$DEPS_DIR/lib/gstreamer-1.0"
          if [ -f "$PLUGIN_DIR/libgstwebrtcdsp.dylib" ]; then
            echo "webrtcdsp plugin already present"
            exit 0
          fi

          echo "=== deps/lib ==="
          ls -la "$DEPS_DIR/lib" || true
          ls -la "$DEPS_DIR/lib/pkgconfig" || true

          export PKG_CONFIG_PATH="$DEPS_DIR/lib/pkgconfig:$PKG_CONFIG_PATH"
          if ! pkg-config --exists webrtc-audio-processing-1; then
            echo "webrtc-audio-processing-1.pc missing"
            exit 1
          fi

          GST_VERSION=$(pkg-config --modversion gstreamer-1.0)
          SRC_DIR="/tmp/gst-mono-${GST_VERSION}"
          if [ ! -d "$SRC_DIR/subprojects/gst-plugins-bad/ext/webrtcdsp" ]; then
            git clone --depth 1 --branch "$GST_VERSION" \
              https://gitlab.freedesktop.org/gstreamer/gstreamer.git "$SRC_DIR"
          fi
          WEBRTCDSP_SRC="$SRC_DIR/subprojects/gst-plugins-bad/ext/webrtcdsp"
          BUILD_DIR="/tmp/webrtcdsp-plugin-build"
          mkdir -p "$BUILD_DIR"
          printf '%s\n' \
            '#ifndef __GST_WEBRTCDSP_CONFIG_H__' \
            '#define __GST_WEBRTCDSP_CONFIG_H__' \
            '#define HAVE_WEBRTC1 1' \
            '#define PACKAGE "gst-plugins-bad"' \
            "#define VERSION \"$GST_VERSION\"" \
            '#define GST_LICENSE "LGPL"' \
            '#define GST_PACKAGE_NAME "GStreamer Bad Plug-ins"' \
            '#define GST_PACKAGE_ORIGIN "https://gstreamer.freedesktop.org"' \
            '#endif' > "$BUILD_DIR/config.h"

          c++ -std=c++17 -shared -fPIC \
            -DHAVE_CONFIG_H \
            -I"$BUILD_DIR" \
            $(pkg-config --cflags webrtc-audio-processing-1 gstreamer-1.0 gstreamer-base-1.0 gstreamer-audio-1.0 gstreamer-bad-audio-1.0) \
            -I/opt/homebrew/include \
            "$WEBRTCDSP_SRC/gstwebrtcdsp.cpp" \
            "$WEBRTCDSP_SRC/gstwebrtcechoprobe.cpp" \
            "$WEBRTCDSP_SRC/gstwebrtcdspplugin.cpp" \
            -o "$BUILD_DIR/libgstwebrtcdsp.dylib" \
            $(pkg-config --libs gstreamer-1.0 gstreamer-base-1.0 gstreamer-audio-1.0 gstreamer-bad-audio-1.0) \
            $(pkg-config --libs --static webrtc-audio-processing-1) \
            -framework Foundation -framework CoreFoundation

          mkdir -p "$PLUGIN_DIR"
          cp "$BUILD_DIR/libgstwebrtcdsp.dylib" "$PLUGIN_DIR/"
          echo "Installed $PLUGIN_DIR/libgstwebrtcdsp.dylib"

      - name: Install JS dependencies
        run: npm ci

      - name: Build native AEC module
        run: |
          ELECTRON_VERSION=$(node -p "require('./node_modules/electron/package.json').version")
          echo "Electron $ELECTRON_VERSION"
          cd src/native/aec
          npm install
          npx cmake-js compile --runtime electron --runtime-version "$ELECTRON_VERSION"

      - name: Build Swift AudioCapture
        run: |
          cd src/native/swift/AudioCapture
          swift build -c release

      - name: Bundle GStreamer dylibs
        run: |
          chmod +x scripts/bundle-gstreamer-mac.sh
          scripts/bundle-gstreamer-mac.sh

      - name: Verify extraResources exist
        run: |
          missing=0
          for f in \
            src/native/swift/AudioCapture/.build/release/audiocapture \
            src/native/aec/build/Release/second-aec.node \
            src/native/aec/deps/lib/gstreamer-1.0/libgstwebrtcdsp.dylib
          do
            if [ ! -e "$f" ]; then
              echo "MISSING $f"
              missing=1
            else
              echo "OK $f"
            fi
          done
          if [ ! -d build/gstreamer-bundle/plugins ] || [ ! -d build/gstreamer-bundle/lib ]; then
            echo "MISSING build/gstreamer-bundle/{plugins,lib}"
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            echo "electron-builder extraResources would fail — aborting"
            exit 1
          fi

      - name: Build TypeScript and Vite
        run: |
          npx tsc
          npx vite build

      - name: Package signed and notarized Mac DMG + zip
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.MAC_CERTIFICATE }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$CSC_LINK" ] || [ -z "$APPLE_ID" ] || [ -z "$APPLE_APP_SPECIFIC_PASSWORD" ] || [ -z "$APPLE_TEAM_ID" ]; then
            echo "Missing Mac signing/notarization secrets on this repo."
            echo "Add: MAC_CERTIFICATE, MAC_CERTIFICATE_PASSWORD, APPLE_ID, APPLE_PASSWORD, APPLE_TEAM_ID"
            exit 1
          fi
          # zip is required for electron-updater on macOS; dmg is the installer.
          npx electron-builder --mac dmg zip --publish never -c.mac.notarize=true

      - name: Guard against read-only files (would break Squirrel self-update)
        run: |
          # Squirrel.Mac's ShipIt strips the download quarantine attribute from
          # every file in the new .app before installing. A read-only file makes
          # removexattr fail with EACCES, ShipIt aborts, and the in-app update
          # silently relaunches the OLD version. Fail the build if any remain.
          APP=$(find release -maxdepth 4 -name 'Second.app' -type d | head -1)
          if [ -z "$APP" ]; then
            echo "Second.app not found under release/ - cannot verify permissions"
            exit 1
          fi
          RO=$(find "$APP" -type f ! -perm -u+w)
          if [ -n "$RO" ]; then
            echo "Read-only files in the app bundle will break macOS self-update:"
            echo "$RO"
            exit 1
          fi
          echo "OK: all files under $APP are user-writable"

      - name: Upload Mac artifacts to the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.refs.outputs.tag }}"
          VERSION="${{ steps.refs.outputs.version }}"
          OUT="release/${VERSION}"
          ls -la "$OUT"

          files=()
          for f in \
            "$OUT"/Second-Mac-"$VERSION"-Installer.dmg \
            "$OUT"/Second-Mac-"$VERSION"-Installer.dmg.blockmap \
            "$OUT"/Second-Mac-"$VERSION"-Installer.zip \
            "$OUT"/Second-Mac-"$VERSION"-Installer.zip.blockmap \
            "$OUT"/latest-mac.yml
          do
            if [ -f "$f" ]; then
              files+=("$f")
            fi
          done

          if [ "${#files[@]}" -eq 0 ]; then
            echo "No Mac artifacts found in $OUT"
            find release -type f
            exit 1
          fi

          gh release upload "$TAG" "${files[@]}" --repo "$GITHUB_REPOSITORY" --clobber
          echo "Uploaded to $GITHUB_REPOSITORY $TAG: ${files[*]}"
