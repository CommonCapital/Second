name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-electron:
    name: Electron Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Security audit
        run: npm audit --audit-level=critical

      - name: Type check (renderer + shared)
        run: npx tsc --noEmit

      - name: Type check (main + preload)
        run: npx tsc --noEmit -p tsconfig.main.json

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npx vitest run
