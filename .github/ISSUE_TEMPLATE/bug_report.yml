name: Bug report
description: Something in Second isn't working as expected
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Second. Every failure should be reproducible: please attach a diagnostics bundle
        (Settings → Second → Diagnostics → Save…). It contains no audio, transcript, card text, profile, or keys.
  - type: input
    id: release
    attributes:
      label: Release
      description: Settings → About.
      placeholder: "0.1.0"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS version, Mac model / CPU, meeting app (Zoom desktop, Google Meet in Chrome, Teams...), audio devices (built-in, AirPods...).
      placeholder: "macOS 15.4, M3 Pro, Zoom 6.4 desktop, AirPods Pro"
    validations:
      required: true
  - type: dropdown
    id: meeting_type
    attributes:
      label: Meeting type
      options:
        - General executive
        - Founder / investment
        - LP / allocator
        - Interview
        - Banker / sponsor
        - Negotiation
        - IC / portfolio
        - Relationship / networking
        - Not in a meeting (setup, settings, self test)
    validations:
      required: true
  - type: dropdown
    id: health_channel
    attributes:
      label: Which health channel failed?
      description: The status rail dots in the overlay (hover for names).
      multiple: true
      options:
        - Mic (You audio)
        - Meeting audio (Them)
        - You transcript
        - Them transcript
        - Coach
        - Network
        - None / not sure
  - type: input
    id: user_message
    attributes:
      label: User-visible message
      description: Exactly what the status rail or notification said.
      placeholder: "I can hear you, not the meeting"
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Start a meeting from Prepare meeting (Founder)
        2. Join Zoom, disconnect AirPods after ~10 minutes
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected state
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual state
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Diagnostics bundle / logs
      description: Drag in the diagnostics JSON. Never paste API keys or meeting content.
